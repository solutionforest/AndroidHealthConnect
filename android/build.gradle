buildscript {
  ext.AndroidHealthConnect = [
    kotlinVersion: "2.2.10",
    minSdkVersion: 29,
    compileSdkVersion: 37,
    targetSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return AndroidHealthConnect[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.1.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
// AGP 9+ enables built-in Kotlin by default and registers the `kotlin` extension
// when `com.android.library` is applied. Applying `kotlin-android` on top fails with:
//   Cannot add extension with name 'kotlin', as there is an extension already registered
//   The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin support since AGP 9.0
// Docs: https://developer.android.com/build/migrate-to-built-in-kotlin
// Only apply the legacy plugin when the host project has not registered that extension yet
// (AGP 8 / android.builtInKotlin=false consumers).
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "com.androidhealthconnect"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Health Connect Jetpack library
  implementation "androidx.health.connect:connect-client:1.2.0-alpha06"

  // Coroutines for async Health Connect API calls
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
