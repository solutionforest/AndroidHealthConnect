name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Public repo: GitHub-hosted runners (free for open source).

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests (coverage thresholds enforced)
        run: yarn test --maxWorkers=2 --coverage --coverageReporters=text-summary

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies (high+)
        # Surfaces known advisories without blocking on transitive RN toolchain noise.
        continue-on-error: true
        run: yarn npm audit --recursive --all --severity high

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> "$GITHUB_ENV"
          fi

      - name: Setup JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK (preinstalled on ubuntu-latest)
        if: env.turbo_cache_hit != 1
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu images ship an Android SDK; avoid setup-android's
          # obsolete `tools` package install.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          if [[ -z "$SDKMANAGER" && -x "${SDK_ROOT}/tools/bin/sdkmanager" ]]; then
            SDKMANAGER="${SDK_ROOT}/tools/bin/sdkmanager"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "platform-tools" || true
          if ! "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "platforms;android-37" "build-tools;37.0.0"; then
            "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "platforms;android-36" "build-tools;36.0.0"
          fi

          mkdir -p example/android
          echo "sdk.dir=${SDK_ROOT}" > example/android/local.properties
          echo "sdk.dir=${SDK_ROOT}" > android/local.properties

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"
