name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All React Native jobs run on the org/repo self-hosted runner.
# Runner should have: Node (see .nvmrc), Yarn, JDK 17+, Android SDK ($ANDROID_HOME).

jobs:
  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  security-audit:
    name: Security audit
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies (high+)
        # Surfaces known advisories without blocking on transitive RN toolchain noise.
        continue-on-error: true
        run: yarn npm audit --recursive --all --severity high

  build-library:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: self-hosted

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Ensure JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Resolve Android SDK path
        if: env.turbo_cache_hit != 1
        run: |
          # Empty proxy strings break sdkmanager / setup-android on this runner.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true

          if [[ -n "${ANDROID_HOME:-}" && -d "${ANDROID_HOME}" ]]; then
            echo "Using existing ANDROID_HOME=${ANDROID_HOME}"
            exit 0
          fi
          if [[ -n "${ANDROID_SDK_ROOT:-}" && -d "${ANDROID_SDK_ROOT}" ]]; then
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
            echo "Mapped ANDROID_SDK_ROOT → ANDROID_HOME"
            exit 0
          fi
          for candidate in \
            "${HOME}/.android/sdk" \
            "${HOME}/Android/Sdk" \
            /opt/android-sdk \
            /usr/lib/android-sdk \
            /usr/local/lib/android/sdk
          do
            if [[ -d "$candidate" ]]; then
              echo "ANDROID_HOME=${candidate}" >> "$GITHUB_ENV"
              echo "Detected ANDROID_HOME=${candidate}"
              exit 0
            fi
          done
          echo "sdk_missing=1" >> "$GITHUB_ENV"
          echo "No Android SDK found; will install via setup-android"

      - name: Require Android SDK
        if: env.turbo_cache_hit != 1 && env.sdk_missing == 1
        run: |
          echo "Android SDK not found on self-hosted runner." >&2
          echo "Install SDK and set ANDROID_HOME (expected: \$HOME/.android/sdk)." >&2
          exit 1

      - name: Accept Android SDK licenses
        if: env.turbo_cache_hit != 1
        run: |
          # Empty proxy strings on this runner break sdkmanager URL parsing.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true
          if [[ -z "${ANDROID_HOME:-}" || ! -d "${ANDROID_HOME}" ]]; then
            echo "ANDROID_HOME is still unset after SDK resolve" >&2
            exit 1
          fi
          SDKMANAGER=""
          if [[ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under ${ANDROID_HOME}; continuing without license accept"
            exit 0
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"
