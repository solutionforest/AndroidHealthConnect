name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All React Native jobs run on the org/repo self-hosted runner.
# Runner should have: Node (see .nvmrc), Yarn, JDK 17+, Android SDK ($ANDROID_HOME).

jobs:
  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  security-audit:
    name: Security audit
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit dependencies (high+)
        # Surfaces known advisories without blocking on transitive RN toolchain noise.
        continue-on-error: true
        run: yarn npm audit --recursive --all --severity high

  build-library:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: self-hosted
    # Google Linux aapt2 is x86_64-only. On ARM64 self-hosted runners the native
    # example build cannot run; skip successfully and keep JS quality gates green.
    # To enable this job, register an x86_64 self-hosted runner and change to:
    #   runs-on: [self-hosted, X64]

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Check runner architecture
        id: arch
        run: |
          echo "runner_arch=${{ runner.arch }}"
          if [[ "${{ runner.arch }}" == "ARM64" ]]; then
            echo "::warning::Skipping Android native build on ARM64. aapt2 is x86_64-only. Add a self-hosted X64 runner labeled X64 to run this job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.arch.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        if: steps.arch.outputs.skip != 'true'
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        if: steps.arch.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        if: steps.arch.outputs.skip != 'true'
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Ensure JDK
        if: steps.arch.outputs.skip != 'true' && env.turbo_cache_hit != 1
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure Android SDK
        if: steps.arch.outputs.skip != 'true' && env.turbo_cache_hit != 1
        run: |
          set -euo pipefail
          # Empty proxy strings on this runner break sdkmanager URL parsing.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true

          SDK_ROOT=""
          if [[ -n "${ANDROID_HOME:-}" && -d "${ANDROID_HOME}" ]]; then
            SDK_ROOT="${ANDROID_HOME}"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" && -d "${ANDROID_SDK_ROOT}" ]]; then
            SDK_ROOT="${ANDROID_SDK_ROOT}"
          else
            for candidate in \
              "${HOME}/.android/sdk" \
              "${HOME}/Android/Sdk" \
              /opt/android-sdk \
              /usr/lib/android-sdk \
              /usr/local/lib/android/sdk
            do
              if [[ -d "$candidate" ]]; then
                SDK_ROOT="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$SDK_ROOT" ]]; then
            SDK_ROOT="${HOME}/.android/sdk"
            mkdir -p "$SDK_ROOT"
          fi

          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "Using ANDROID_HOME=${SDK_ROOT}"

          find_sdkmanager() {
            if [[ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
              echo "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
              return 0
            fi
            find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -1 || true
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Installing Android cmdline-tools..."
            TMP="$(mktemp -d)"
            curl -fsSL -o "$TMP/cmdline-tools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q "$TMP/cmdline-tools.zip" -d "$TMP"
            mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
            cp -R "$TMP"/cmdline-tools/. "${SDK_ROOT}/cmdline-tools/latest/"
            rm -rf "$TMP"
            SDKMANAGER="$(find_sdkmanager)"
          fi

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager still missing under ${SDK_ROOT}" >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true

          install_pkg() {
            local pkg="$1"
            echo "Installing ${pkg}..."
            if "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --install "${pkg}"; then
              return 0
            fi
            echo "Warning: failed to install ${pkg}" >&2
            return 1
          }

          install_pkg "platform-tools" || true
          install_pkg "build-tools;37.0.0" || install_pkg "build-tools;36.1.0" || install_pkg "build-tools;36.0.0" || true
          if ! install_pkg "platforms;android-37"; then
            install_pkg "platforms;android-36" || true
          fi

          mkdir -p example/android
          echo "sdk.dir=${SDK_ROOT}" > example/android/local.properties
          echo "sdk.dir=${SDK_ROOT}" > android/local.properties || true

      - name: Cache Gradle
        if: steps.arch.outputs.skip != 'true' && env.turbo_cache_hit != 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        if: steps.arch.outputs.skip != 'true'
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy || true
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"
