name: Version check

on:
  schedule:
    # Every Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: version-check
  cancel-in-progress: true

jobs:
  check:
    name: Check upstream & library versions
    runs-on: self-hosted
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Ensure ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
            exit 0
          fi
          echo "ripgrep (rg) must be installed on the self-hosted runner" >&2
          exit 1

      - name: Check versions and open upgrade reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/check-versions.sh
