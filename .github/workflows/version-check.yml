name: Version check

# Short check: library release vs GitHub + Health Connect connect-client vs Maven.
# Opens/updates an `upgrade-reminder` issue when something is behind.
#
# Cadence (pick one cron):
#   daily:     0 8 * * *
#   weekly:    0 8 * * 1          ← current
#   bi-weekly: 0 8 1,15 * *

on:
  schedule:
    # Weekly — Monday 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: version-check
  cancel-in-progress: true

jobs:
  check:
    name: Check HC SDK & library versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check versions and open upgrade reminder
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/check-versions.sh
