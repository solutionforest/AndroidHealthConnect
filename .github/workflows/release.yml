name: Release

# Build, attach GitHub Release .tgz + SPDX SBOM, attest provenance, and publish
# to GitHub Packages (npm.pkg.github.com). Does NOT publish to registry.npmjs.org.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build/upload/publish (e.g. v0.3.3). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, GitHub Release & Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.tag || github.ref) || github.ref }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${VERSION}"
          fi
          # yarn pack replaces / with - but keeps @ in scoped package filenames
          ASSET_NAME="${NAME//\//-}-${VERSION}.tgz"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} name=${NAME} version=${VERSION} asset=${ASSET_NAME}"

      - name: Build package (bob + plugin)
        run: yarn prepare

      - name: Pack tarball
        run: |
          set -euo pipefail
          yarn pack --out "${{ steps.meta.outputs.asset }}"
          ls -lh "${{ steps.meta.outputs.asset }}"

      - name: Generate SBOM (SPDX) for tarball
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.meta.outputs.asset }}
          format: spdx-json
          output-file: ${{ steps.meta.outputs.asset }}.spdx.json
          upload-artifact: true
          upload-release-assets: false
          artifact-name: ${{ steps.meta.outputs.asset }}.spdx.json

      - name: Attest build provenance for tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.asset }}

      - name: Attest SBOM for tarball
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.asset }}
          sbom-path: ${{ steps.meta.outputs.asset }}.spdx.json

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ASSET="${{ steps.meta.outputs.asset }}"
          SBOM="${ASSET}.spdx.json"
          gh release upload "$TAG" "$ASSET" "$SBOM" --clobber
          echo "Uploaded ${ASSET} and ${SBOM} to ${TAG}"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "@solutionforest:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc
          # Provenance for GH Packages is via GitHub artifact attestations above
          # (npm --provenance targets registry.npmjs.org).
          npm publish --access public --registry=https://npm.pkg.github.com
          echo "Published ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} to GitHub Packages"
